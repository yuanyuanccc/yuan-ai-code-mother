spring:
  application:
    name: yuan-ai-code-mother-backend
  profiles:
    active: local
  session:
    timeout: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yuan_ai_code_mother
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
      password:
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.yuanc.yuanaicodemother.controller
knife4j:
  enable: true
  setting:
    language: zh_cn

